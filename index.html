<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>RAW Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>

<header class="top">
  <div class="brand"><b>RAW</b> Shop</div>
  <div class="sp"></div>
  <div class="who" id="who"></div>
  <button class="iconbtn" id="menuBtn" hidden>Menu</button>
</header>

<main class="wrap" id="view"></main>

<input type="file" id="snap" accept="image/*" capture="environment" hidden>
<input type="file" id="pickMany" accept="image/*" multiple hidden>
<input type="file" id="pickParts" accept="image/*" multiple hidden>
<input type="file" id="pickOne" accept="image/*" hidden>

<script src="js/api.js"></script>
<script src="js/qr.js"></script>
<script src="js/pdf-lib.min.js"></script>
<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const view = $("#view");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n) => "$" + (Number(n) || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const carName = (c) => [c.year, c.make, c.model].filter(Boolean).join(" ") || "Vehicle";
const when = (t) => { const d = new Date(t); return d.toLocaleDateString([], { month: "short", day: "numeric" }) + " · " + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); };
const STATUS = [
  ["checked_in", "Checked in"], ["in_progress", "Working on it"], ["waiting_parts", "Waiting on parts"], ["ready", "Ready"], ["picked_up", "Picked up"],
];
const statusLabel = (s) => (STATUS.find((x) => x[0] === s) || [, s])[1];
const PAGE_BASE = location.href.replace(/[#?].*$/, "").replace(/index\.html$/, "").replace(/\/?$/, "/");
const carLink = (car) => `${PAGE_BASE}car.html?t=${car.public_token}`;

const ICON = {
  cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h3l2-3h8l2 3h3v11H3z"/><circle cx="12" cy="13" r="4"/></svg>',
  part: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7l8-4 8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg>',
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>',
};

let me = null;          // { user, member, shop }
let boardFilter = "open";
let carCache = null;

/* ---------- small UI helpers ---------- */
function toast(msg, ms = 2600) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
function busy(msg) {
  let b = $(".busy"); if (!msg) { b && b.remove(); return; }
  if (!b) { b = document.createElement("div"); b.className = "busy"; document.body.appendChild(b); }
  b.textContent = msg;
}
function sheet(html, onMount) {
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  bg.innerHTML = `<div class="sheet" role="dialog">${html}</div>`;
  bg.addEventListener("click", (e) => { if (e.target === bg) close(); });
  document.body.appendChild(bg);
  function close() { bg.remove(); }
  onMount && onMount(bg.firstElementChild, close);
  return close;
}
function lightbox(src) {
  const d = document.createElement("div"); d.className = "lightbox"; d.innerHTML = `<img src="${esc(src)}" alt="">`;
  d.onclick = () => d.remove(); document.body.appendChild(d);
}
function pick(input, multiple) {
  return new Promise((res) => {
    input.value = "";
    input.onchange = () => res([...input.files]);
    input.click();
  });
}
async function fail(e) {
  busy(null);
  if (String(e && e.message) === "signed_out") { route("#/login"); return; }
  console.error(e); toast(e.message || "Something went wrong");
}

/* resize a phone photo before upload (keeps uploads quick on shop wifi) */
async function shrink(file, max = 1600, q = 0.82) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((ok) => c.toBlob(ok, "image/jpeg", q));
  } finally { URL.revokeObjectURL(url); }
}
const toB64 = (blob) => new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(String(r.result)); r.readAsDataURL(blob); });

/* dictation: browser speech if it has it, otherwise the keyboard mic works in any box */
function attachMic(btn, ta) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { btn.onclick = () => { ta.focus(); toast("Tap the mic on your keyboard to talk"); }; return; }
  let rec = null;
  btn.onclick = () => {
    if (rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = "en-US"; rec.continuous = true; rec.interimResults = false;
    const start = ta.value;
    let said = "";
    rec.onresult = (e) => { for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) said += e.results[i][0].transcript + " "; ta.value = (start ? start + " " : "") + said.trim(); };
    rec.onend = () => { rec = null; btn.classList.remove("on"); btn.lastChild.textContent = " Talk"; };
    rec.onerror = () => {};
    rec.start(); btn.classList.add("on"); btn.lastChild.textContent = " Stop";
  };
}

/* ---------- pick-lists: start typing, pick from what the shop has used before ---------- */
let picks = null;
async function loadPicks() {
  if (picks) return picks;
  const [items, phrases] = await Promise.all([
    api.select("shop_items", `select=id,code,description,price,taxable,kind&shop_id=eq.${me.shop.id}&order=use_count.desc,last_used.desc&limit=3000`),
    api.select("shop_phrases", `select=id,text&shop_id=eq.${me.shop.id}&order=use_count.desc,last_used.desc&limit=3000`),
  ]);
  return (picks = { items, phrases });
}
function rank(list, q, key, n = 6) {
  const ws = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!ws.length || q.trim().length < 2) return [];
  return list.filter((x) => { const t = key(x).toLowerCase(); return ws.every((w) => t.includes(w)); }).slice(0, n);
}
function attachSuggest(input, getQuery, search, renderItem, onPick) {
  const box = document.createElement("div"); box.className = "sug"; box.hidden = true;
  (input.closest(".lcode") || input).insertAdjacentElement("afterend", box);
  let list = [];
  const show = async () => {
    const q = getQuery();
    if (!q || q.trim().length < 2) { box.hidden = true; return; }
    const pk = await loadPicks().catch(() => null); if (!pk) return;
    list = search(pk, q);
    if (!list.length) { box.hidden = true; return; }
    box.innerHTML = list.map((x, i) => `<button type="button" data-i="${i}">${renderItem(x)}</button>`).join("");
    box.hidden = false;
  };
  input.addEventListener("input", show);
  input.addEventListener("blur", () => setTimeout(() => { box.hidden = true; }, 200));
  box.addEventListener("pointerdown", (e) => { const b = e.target.closest("[data-i]"); if (!b) return; e.preventDefault(); const x = list[+b.dataset.i]; box.hidden = true; onPick(x); });
}
function suggestItems(input, onPick) {
  attachSuggest(input, () => input.value, (pk, q) => rank(pk.items, q, (x) => `${x.code || ""} ${x.description}`),
    (x) => `<span>${esc(x.description)}</span><span class="sm">${esc(x.code || "")}${x.price != null ? " · " + money(x.price) : ""}</span>`,
    (x) => { input.value = x.description; onPick(x); });
}
function suggestPhrases(ta, after) {
  const cur = () => ta.value.slice(0, ta.selectionStart ?? ta.value.length).split("\n").pop();
  attachSuggest(ta, cur, (pk, q) => rank(pk.phrases, q, (x) => x.text), (x) => `<span>${esc(x.text)}</span>`, (x) => {
    const pos = ta.selectionStart ?? ta.value.length;
    const start = ta.value.lastIndexOf("\n", pos - 1) + 1;
    let end = ta.value.indexOf("\n", pos); if (end < 0) end = ta.value.length;
    ta.value = ta.value.slice(0, start) + x.text + "\n" + ta.value.slice(end).replace(/^\n/, "");
    const c = start + x.text.length + 1; ta.focus(); try { ta.setSelectionRange(c, c); } catch (_) {}
    after && after();
  });
}
const learnPhrases = (text) => { const t = String(text || "").split("\n").map((x) => x.trim()).filter(Boolean); if (t.length) { api.rpc("shop_learn_phrases", { sid: me.shop.id, texts: t }).catch(() => {}); picks = null; } };

/* ---------- routing ---------- */
function route(h) { if (location.hash === h) render(); else location.hash = h; }
window.addEventListener("hashchange", render);

async function render() {
  const h = location.hash || "#/";
  $("#menuBtn").hidden = !me;
  if (!api.signedIn()) return showLogin();
  if (!me) { try { await loadMe(); } catch (e) { return fail(e); } if (!me) return; }
  window.scrollTo(0, 0);
  const m = h.match(/^#\/car\/([0-9a-f-]+)(?:\/(\w+))?/);
  if (h === "#/new") return showIntake();
  if (m) return showCar(m[1], m[2] || "log");
  if (h === "#/crew") return showCrew();
  if (h === "#/settings") return showSettings();
  return showBoard();
}

async function loadMe() {
  const rows = await api.select("shop_members", `select=shop_id,user_id,display_name,role,active,shops(*)&user_id=eq.${api.user.id}&active=is.true`);
  if (!rows.length) {
    view.innerHTML = `<div class="card"><h2>No shop on this login</h2><p class="muted">Ask the shop owner to add you on the Crew screen.</p><button class="btn ghost" id="so">Sign out</button></div>`;
    $("#so").onclick = () => { api.signOut(); me = null; render(); };
    return;
  }
  const r = rows[0];
  me = { user: api.user, member: r, shop: r.shops };
  $("#who").textContent = r.display_name;
  $("#menuBtn").hidden = false;
}

$("#menuBtn").onclick = () => {
  const owner = me && me.member.role === "owner";
  sheet(`<h2>${esc(me.shop.name)}</h2>
    <div style="display:grid;gap:10px">
      <a class="btn block" href="#/">Cars in the shop</a>
      <a class="btn block" href="#/new">Check in a car</a>
      ${owner ? '<a class="btn block" href="#/crew">Crew &amp; PINs</a><a class="btn block" href="#/settings">Shop settings</a>' : ""}
      <button class="btn ghost block" id="so">Switch person</button>
    </div>`, (el, close) => {
    $$("a", el).forEach((a) => a.addEventListener("click", close));
    $("#so", el).onclick = () => { close(); api.signOut(); me = null; $("#who").textContent = ""; route("#/"); };
  });
};

/* ---------- login: shop code (once per phone) → tap your name → 4-digit PIN ---------- */
const CODE_KEY = "rawshop.code";
const getCode = () => { try { return localStorage.getItem(CODE_KEY) || ""; } catch (_) { return ""; } };
const setCode = (c) => { try { c ? localStorage.setItem(CODE_KEY, c) : localStorage.removeItem(CODE_KEY); } catch (_) {} };

async function showLogin() {
  $("#menuBtn").hidden = true; $("#who").textContent = "";
  const code = getCode();
  if (!code) {
    view.innerHTML = `<div style="max-width:420px;margin:30px auto">
      <h1>Shop code</h1><p class="muted">Enter it once on this phone.</p>
      <form id="cf" class="section">
        <input class="t" id="code" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go" style="font-size:24px;text-align:center;letter-spacing:.2em;text-transform:uppercase" required>
        <button class="btn red block big section" type="submit">Next</button>
      </form></div>`;
    setTimeout(() => $("#code").focus(), 50);
    $("#cf").onsubmit = async (e) => {
      e.preventDefault(); const c = $("#code").value.toLowerCase().replace(/[^a-z0-9]/g, ""); busy("Checking…");
      try { await api.fn("shop-login", { action: "crew", code: c }, true); setCode(c); busy(null); showLogin(); }
      catch (err) { busy(null); toast(err.message); }
    };
    return;
  }
  view.innerHTML = `<div class="empty">Loading…</div>`;
  let d;
  try { d = await api.fn("shop-login", { action: "crew", code }, true); }
  catch (err) { if (/code/i.test(err.message)) { setCode(""); return showLogin(); } view.innerHTML = `<div class="empty">${esc(err.message)}</div>`; return; }
  view.innerHTML = `<div style="max-width:480px;margin:10px auto">
    <h1>Who's working?</h1><p class="muted">${esc(d.shop)}</p>
    <div class="section" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      ${d.crew.map((c) => `<button class="btn big" data-id="${c.id}" data-name="${esc(c.name)}">${esc(c.name)}</button>`).join("") || `<p class="muted">No crew set up yet.</p>`}
    </div>
    <button class="back section" id="chg">Different shop code</button></div>`;
  $("#chg").onclick = () => { setCode(""); showLogin(); };
  $$("[data-id]", view).forEach((b) => b.onclick = () => pinPad(code, b.dataset.id, b.dataset.name));
}

function pinPad(code, userId, name) {
  let pin = "";
  sheet(`<h2 style="text-align:center">${esc(name)}</h2><p class="muted" style="text-align:center;margin:0">Enter your PIN</p>
    <div id="dots" style="display:flex;justify-content:center;gap:14px;margin:18px 0">${"<span></span>".repeat(4)}</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto">
      ${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map((k) => k === "" ? "<span></span>" : `<button class="btn big" data-k="${k}" style="font-size:26px">${k}</button>`).join("")}
    </div>`, (el, close) => {
    const dots = () => $$("#dots span", el).forEach((d, i) => d.style.cssText = `width:16px;height:16px;border-radius:50%;border:2px solid var(--text);background:${i < pin.length ? "var(--text)" : "transparent"}`);
    dots();
    $$("[data-k]", el).forEach((b) => b.onclick = async () => {
      const k = b.dataset.k;
      if (k === "⌫") { pin = pin.slice(0, -1); return dots(); }
      if (pin.length >= 4) return;
      pin += k; dots();
      if (pin.length === 4) {
        busy("Signing in…");
        try {
          const s = await api.fn("shop-login", { action: "pin", code, user_id: userId, pin }, true);
          api.setSession(s); me = null; picks = null; busy(null); close(); route("#/");
        } catch (err) { busy(null); toast(err.message); pin = ""; dots(); }
      }
    });
  });
}

/* ---------- board ---------- */
async function showBoard() {
  view.innerHTML = `<a class="btn red block big" href="#/new">+ Check in a car</a>
    <div class="section"><input class="t" id="q" type="search" placeholder="Search name, car, phone" autocomplete="off"></div>
    <div class="filters" id="filt">
      ${[["open", "In the shop"], ["ready", "Ready"], ["picked_up", "Picked up"], ["all", "All"]].map(([k, l]) => `<button class="chip ${boardFilter === k ? "on" : ""}" data-f="${k}">${l}</button>`).join("")}
    </div>
    <div id="cars" class="cars"><div class="empty">Loading…</div></div>`;
  $$("#filt .chip").forEach((b) => b.onclick = () => { boardFilter = b.dataset.f; showBoard(); });
  try {
    let q = `select=id,year,make,model,color,status,intake_photo,updated_at,shop_customers(name,phone)&shop_id=eq.${me.shop.id}&order=updated_at.desc&limit=300`;
    if (boardFilter === "open") q += "&status=not.in.(picked_up,ready)";
    else if (boardFilter !== "all") q += `&status=eq.${boardFilter}`;
    const cars = await api.select("shop_cars", q);
    const urls = await api.signed(cars.map((c) => c.intake_photo));
    const draw = (term) => {
      const t = (term || "").toLowerCase();
      const list = cars.filter((c) => !t || [c.shop_customers?.name, c.shop_customers?.phone, c.year, c.make, c.model, c.color].join(" ").toLowerCase().includes(t));
      $("#cars").innerHTML = list.length ? list.map((c) => `
        <button class="tile" data-id="${c.id}">
          <div class="ph ${urls[c.intake_photo] ? "" : "none"}" style="${urls[c.intake_photo] ? `background-image:url('${esc(urls[c.intake_photo])}')` : ""}">${urls[c.intake_photo] ? "" : "RAW"}<span class="pill s-${c.status}">${statusLabel(c.status)}</span></div>
          <div class="tx"><div class="nm">${esc(c.shop_customers?.name || "No name")}</div><div class="cr">${esc(carName(c))}${c.color ? " · " + esc(c.color) : ""}</div></div>
        </button>`).join("") : `<div class="empty">${cars.length ? "No match." : "No cars here yet. Tap Check in a car to start one."}</div>`;
      $$("#cars .tile").forEach((b) => b.onclick = () => route(`#/car/${b.dataset.id}`));
    };
    draw("");
    $("#q").oninput = (e) => draw(e.target.value);
  } catch (e) { fail(e); }
}

/* ---------- intake ---------- */
function showIntake() {
  let photo = null;
  view.innerHTML = `<button class="back" onclick="history.back()">‹ Back</button>
    <h1>Check in a car</h1>
    <form id="inf" autocomplete="off">
    <div class="section"><div class="shot" id="shot">Tap to take a photo of the car</div></div>

    <div class="section">
      <label class="f"><span>Customer name</span><input class="t" id="c_name" required autocapitalize="words"></label>
      <label class="f"><span>Phone</span><input class="t" id="c_phone" type="tel" inputmode="tel"></label>
      <label class="f"><span>What is it?</span><input class="t" id="v_what" autocapitalize="words" placeholder="2015 Jeep JK"></label>
      <label class="f"><span>What are we doing? (optional)</span><textarea class="t" id="v_work" style="min-height:70px" placeholder="Talk or type"></textarea></label>
      <button type="button" class="btn ghost mic" id="mic">${ICON.mic}<span> Talk</span></button>
      <details class="section"><summary class="muted" style="cursor:pointer;padding:6px 0">More (email, address, color, VIN)</summary>
        <div class="section">
          <label class="f"><span>Email</span><input class="t" id="c_email" type="email" inputmode="email" autocapitalize="off"></label>
          <label class="f"><span>Address</span><input class="t" id="c_addr" autocapitalize="words"></label>
          <div class="grid2"><label class="f"><span>Color</span><input class="t" id="v_color" autocapitalize="words"></label>
          <label class="f"><span>VIN</span><input class="t" id="v_vin" autocapitalize="characters"></label></div>
        </div>
      </details>
    </div>

    <div class="section"><h2>Drop-off agreement</h2>
      <div class="waiver">${esc(me.shop.waiver_text || "")}</div>
      <p class="small muted" style="margin:10px 0 6px">Customer signs here</p>
      <canvas class="sig" id="sig"></canvas>
      <div class="row" style="margin-top:8px">
        <input class="t" id="sig_name" placeholder="Printed name">
        <button type="button" class="btn ghost" id="sigClear" style="flex:0 0 auto">Clear</button>
      </div>
    </div>

    <div class="section"><button class="btn red block big" type="submit">Check in &amp; make QR code</button></div>
    </form>`;
  attachMic($("#mic"), $("#v_work")); suggestPhrases($("#v_work"));
  $("#c_name").addEventListener("input", (e) => { if (!$("#sig_name").dataset.touched) $("#sig_name").value = e.target.value; });
  $("#sig_name").addEventListener("input", (e) => { e.target.dataset.touched = 1; });

  $("#shot").onclick = async () => {
    const [f] = await pick($("#pickOne")); if (!f) return;
    photo = await shrink(f);
    $("#shot").style.backgroundImage = `url('${URL.createObjectURL(photo)}')`; $("#shot").classList.add("has"); $("#shot").textContent = "";
  };

  // signature pad
  const cv = $("#sig"), ctx = cv.getContext("2d"); let drawn = false, down = false;
  const size = () => { const r = cv.getBoundingClientRect(); cv.width = r.width * 2; cv.height = r.height * 2; ctx.scale(2, 2); ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.strokeStyle = "#111"; };
  size();
  const pt = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.onpointerdown = (e) => { down = true; cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...pt(e)); };
  cv.onpointermove = (e) => { if (!down) return; ctx.lineTo(...pt(e)); ctx.stroke(); drawn = true; };
  cv.onpointerup = () => { down = false; };
  $("#sigClear").onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); drawn = false; };

  $("#inf").onsubmit = async (e) => {
    e.preventDefault();
    if (!drawn && !confirmNoSig()) return;
    busy("Checking in…");
    try {
      const shop_id = me.shop.id;
      const cust = await api.insert("shop_customers", { shop_id, name: $("#c_name").value.trim(), phone: $("#c_phone").value.trim() || null, email: $("#c_email").value.trim() || null, address: $("#c_addr").value.trim() || null });
      const car = await api.insert("shop_cars", {
        shop_id, customer_id: cust.id, ...splitWhat($("#v_what").value),
        color: $("#v_color").value.trim() || null, vin: $("#v_vin").value.trim() || null, work_requested: $("#v_work").value.trim() || null, created_by: me.user.id,
      });
      const patch = {};
      if (photo) patch.intake_photo = await api.upload(`${shop_id}/${car.id}/intake-${uid()}.jpg`, photo);
      if (drawn) {
        const png = await new Promise((ok) => cv.toBlob(ok, "image/png"));
        patch.waiver_signature = await api.upload(`${shop_id}/${car.id}/signature-${uid()}.png`, png);
        patch.waiver_signed_at = new Date().toISOString();
        patch.waiver_signed_name = $("#sig_name").value.trim() || cust.name;
      }
      if (Object.keys(patch).length) await api.update("shop_cars", `id=eq.${car.id}`, patch);
      learnPhrases($("#v_work").value);
      await api.insert("shop_entries", { shop_id, car_id: car.id, kind: "status", body: "Checked in", shared: true, author_id: me.user.id, author_name: me.member.display_name });
      busy(null);
      route(`#/car/${car.id}`);
      setTimeout(() => shareSheet({ ...car, ...patch }, cust, true), 300);
    } catch (err) { fail(err); }
  };
  function confirmNoSig() {
    toast("Have the customer sign the drop-off agreement first"); return false;
  }
}

/* "2015 Jeep JK" -> year 2015, make Jeep, model JK */
function splitWhat(v) {
  const t = String(v || "").trim().split(/\s+/).filter(Boolean);
  const year = /^(19|20)\d{2}$/.test(t[0] || "") ? t.shift() : null;
  return { year, make: t.shift() || null, model: t.join(" ") || null };
}

    api.select("shop_cars", `select=*,shop_customers(*)&id=eq.${id}`),
    api.select("shop_entries", `select=*&car_id=eq.${id}&order=created_at.desc`),
    api.select("shop_parts", `select=*&car_id=eq.${id}&status=neq.removed&order=created_at.asc`),
    api.select("shop_invoices", `select=*&car_id=eq.${id}&order=created_at.desc`),
  ]);
  if (!cars.length) throw new Error("That car isn't in this shop.");

  carCache = { car, cust: car.shop_customers, entries, parts, invoices, urls };

}

/* Part photo: the only photos the AI reads */
async function addPartPhotos(car) {
  const files = await pick($("#pickParts"), true);

  let found = 0, missed = 0;
  try {
    for (let i = 0; i < files.length; i++) {
      busy(`Reading part ${i + 1} of ${files.length}…`);
      const blob = await shrink(files[i], 2000, 0.88);
      const path = await api.upload(`${me.shop.id}/${car.id}/part-${uid()}.jpg`, blob);
      const entry = await api.insert("shop_entries", { shop_id: me.shop.id, car_id: car.id, kind: "part_photo", photo: path, shared: false, author_id: me.user.id, author_name: me.member.display_name });

/* Updates tab: photos grouped by who/when, notes, status changes */
function tabLog(box) {
  const { car, entries, urls } = carCache;
  const items = entries.filter((e) => e.kind !== "part_photo");
  const groups = [];
  for (const e of items) {
    const g = groups[groups.length - 1];
    if (g && e.kind === "photo" && g.kind === "photo" && g.author_id === e.author_id && g.shared === e.shared && Math.abs(new Date(g.items[g.items.length - 1].created_at) - new Date(e.created_at)) < 15 * 60 * 1000) g.items.push(e);
    else groups.push({ kind: e.kind, author_id: e.author_id, author_name: e.author_name, shared: e.shared, items: [e] });
  }
  box.innerHTML = (car.work_requested ? `<div class="card" style="margin-bottom:6px"><div class="tag">Work requested</div><div style="white-space:pre-wrap;margin-top:4px">${esc(car.work_requested)}</div></div>` : "") +
    (groups.length ? groups.map((g, gi) => {
      const first = g.items[0];
      const head = `<div class="meta">${esc(g.author_name || "")} · ${when(first.created_at)}</div>
        <button class="eye ${g.shared ? "on" : ""}" data-g="${gi}" title="Customer can see this">${g.shared ? "Customer sees" : "Shop only"}</button>`;
      if (g.kind === "photo") return `<div class="entry">${head}${g.items.map((e) => e.body).filter(Boolean).map((b) => `<div class="body">${esc(b)}</div>`).join("")}<div class="pics">${g.items.map((e) => urls[e.photo] ? `<img loading="lazy" src="${esc(urls[e.photo])}" alt="" data-full="${esc(urls[e.photo])}" data-id="${e.id}">` : "").join("")}</div></div>`;
      if (g.kind === "status") return `<div class="entry">${head}<div class="body"><span class="pill s-${STATUS.find((s) => s[1] === first.body)?.[0] || ""}">${esc(first.body)}</span></div></div>`;
      return `<div class="entry">${head}<div class="body">${esc(first.body)}</div></div>`;
    }).join("") : `<div class="empty">No updates yet. Add photos or talk a note.</div>`);
  $$(".pics img", box).forEach((i) => i.onclick = () => photoView(i.dataset.full, i.dataset.id));
  $$(".eye", box).forEach((b) => b.onclick = async () => {
    const g = groups[+b.dataset.g]; const to = !g.shared;
    try { await api.update("shop_entries", `id=in.(${g.items.map((e) => e.id).join(",")})`, { shared: to }); g.items.forEach((e) => e.shared = to); g.shared = to; b.classList.toggle("on", to); b.textContent = to ? "Customer sees" : "Shop only"; }
    catch (e) { fail(e); }
  });
}

/* Invoice tab — laid out like RAW's own invoices: item code, T for taxable, deposit, shipping */
const LINE_KIND = { part: "Part", labor: "Labor", other: "Shipping / other", deposit: "Deposit" };
const lineAmt = (l) => r2((Number(l.qty) || 0) * (Number(l.price) || 0)) * (l.kind === "deposit" ? -1 : 1);
const isTaxable = (l) => l.kind !== "deposit" && (l.taxable ?? l.kind === "part");
function invTotals(lines, rate) {
  let sub = 0, taxable = 0, dep = 0;
  for (const l of lines) { const a = Math.abs(lineAmt(l)); if (l.kind === "deposit") dep += a; else { sub += a; if (isTaxable(l)) taxable += a; } }
  sub = r2(sub); dep = r2(dep); const tax = r2(taxable * rate);
  return { subtotal: sub, tax, total: r2(sub + tax - dep) };
}
const depositOf = (lines) => r2((lines || []).filter((l) => l.kind === "deposit").reduce((a, l) => a + Math.abs(lineAmt(l)), 0));
const initials = (n) => String(n || "").split(/\s+/).filter(Boolean).map((w) => w[0].toUpperCase()).join("").slice(0, 3);
const partLine = (p) => ({ kind: "part", part_id: p.id, code: p.part_number || "", description: p.description || p.part_number || "Part", qty: Number(p.qty) || 1, price: Number(p.unit_price) || 0, taxable: true });
const laborLine = () => ({ kind: "labor", code: "Labor", description: "RAW in-house labor", qty: 1, price: Number(me.shop.labor_rate) || 0, taxable: false });
function workFromLog(entries) {
  return entries.filter((e) => (e.kind === "note" || e.kind === "photo") && e.body).slice().reverse()
    .flatMap((e) => String(e.body).split("\n")).map((t) => t.replace(/^[-•*\s]+/, "").trim()).filter(Boolean).join("\n");
}

function tabInvoice(box) {
  const { car, cust, parts, invoices, entries } = carCache;
  const draft = invoices.find((i) => i.status === "draft");
  const past = invoices.filter((i) => i.status !== "draft");
  const pastHtml = past.length ? `<div class="section"><h2>Sent invoices</h2>${past.map((i) => `
      <div class="entry"><div><strong>#${i.number}</strong> · ${money(i.total)} <span class="pill ${i.status === "paid" ? "s-ready" : "s-waiting_parts"}">${i.status === "paid" ? "Paid" : "Sent"}</span></div>
      <div class="row" style="flex:0 0 auto;gap:6px">${i.status !== "paid" ? `<button class="btn ghost" data-paid="${i.id}" style="min-height:38px;padding:6px 10px">Mark paid</button>` : ""}<button class="btn ghost" data-resend="${i.id}" style="min-height:38px;padding:6px 10px">Resend</button></div>
      <div class="meta">${i.sent_at ? "Sent " + when(i.sent_at) : ""}${i.paid_at ? " · Paid " + when(i.paid_at) : ""}</div></div>`).join("")}</div>` : "";

  if (!draft) {
    const onBill = parts.filter((p) => p.status === "on_bill");
    box.innerHTML = `<div class="card"><h2>New invoice</h2><p class="muted">${onBill.length} part${onBill.length === 1 ? "" : "s"} on the bill. The crew's comments fill in the work performed list. Add labor and anything else on the next screen.</p>
      <button class="btn red block big" id="start">Start invoice</button></div>${pastHtml}`;
    $("#start").onclick = async () => {
      try {
        const lines = [...onBill.map(partLine), laborLine()];
        const rate = Number(me.shop.tax_rate) || 0;
        await api.insert("shop_invoices", { shop_id: me.shop.id, car_id: car.id, lines, tax_rate: rate, work_done: workFromLog(entries) || null, rep: initials(me.member.display_name), ...invTotals(lines, rate) });
        refresh("invoice");
      } catch (e) { fail(e); }
    };
    wirePast(box); return;
  }

  // keep parts on the bill in sync with the draft
  const lines = (draft.lines || []).map((l) => ({ ...l, taxable: l.taxable ?? (l.kind === "part") }));
  const inLines = new Set(lines.filter((l) => l.part_id).map((l) => l.part_id));
  parts.filter((p) => p.status === "on_bill" && !inLines.has(p.id)).forEach((p) => lines.unshift(partLine(p)));
  const rate = Number(draft.tax_rate) || 0;
  let workDone = draft.work_done || "", recs = draft.recommendations || "", note = draft.notes || "";

  const draw = () => {
    const t = invTotals(lines, rate), dep = depositOf(lines);
    box.innerHTML = `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><h2>Draft invoice</h2><span class="small muted">${esc(cust.name)} · ${esc(carName(car))}</span></div>

          <span style="display:flex;align-items:center;gap:10px">${l.kind === "deposit" ? "" : `<label class="small muted" style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-k="taxable" ${isTaxable(l) ? "checked" : ""} style="width:18px;height:18px">Taxable</label>`}<button class="x" data-del="${i}" title="Remove line">✕</button></span></div>
        <div class="lcode" ${l.kind === "deposit" ? 'style="grid-template-columns:1fr"' : ""}>

          <div class="pickwrap"><input class="t" data-k="description" value="${esc(l.description || "")}" placeholder="${l.kind === "deposit" ? "Deposit (how it was paid, date)" : "Start typing to pick"}" autocomplete="off"></div>
        </div>
        <div class="lrow">
          ${l.kind === "deposit" ? "<span></span>" : `<label><span>${l.kind === "labor" ? "Hours" : "Qty"}</span><input class="t" data-k="qty" type="number" inputmode="decimal" step="any" value="${esc(l.qty)}"></label>`}
          <label><span>${l.kind === "labor" ? "Rate" : l.kind === "deposit" ? "Amount" : "Price each"}</span><input class="t" data-k="price" type="number" inputmode="decimal" step="0.01" value="${esc(l.price)}"></label>
          <div class="amt">${l.kind === "deposit" ? "−" + money(Math.abs(lineAmt(l))) : money(lineAmt(l))}${isTaxable(l) ? ' <span class="small muted">T</span>' : ""}</div>
        </div></div>`).join("")}</div>
      <div class="addrow"><button class="btn ghost" data-add="part">+ Part</button><button class="btn ghost" data-add="labor">+ Labor</button><button class="btn ghost" data-add="other">+ Shipping / other</button><button class="btn ghost" data-add="deposit">+ Deposit</button></div>
      <div class="totals"><div><span>Subtotal</span><span>${money(t.subtotal)}</span></div><div><span>Sales tax (${(rate * 100).toFixed(2)}%)</span><span>${money(t.tax)}</span></div>${dep ? `<div><span>Deposit paid</span><span>−${money(dep)}</span></div>` : ""}<div class="grand"><span>Total due</span><span>${money(t.total)}</span></div></div>
      <label class="f section"><span>Work performed (one item per line)</span><textarea class="t" id="invWork" style="min-height:140px" placeholder="Start typing to pick from past work">${esc(workDone)}</textarea></label>
      <label class="f"><span>Recommendations for next time (optional)</span><textarea class="t" id="invRecs" style="min-height:70px">${esc(recs)}</textarea></label>
      <label class="f"><span>Note on invoice (optional)</span><textarea class="t" id="invNote" style="min-height:50px">${esc(note)}</textarea></label>
      <div style="display:grid;gap:10px">
        <button class="btn red block big" id="send">${cust.email ? "Send invoice to " + esc(cust.email) : "Finish invoice"}</button>
        <button class="btn ghost block" id="saveD">Save draft</button>
      </div>
      ${me.shop.payment_url ? "" : `<p class="small muted" style="margin-top:10px">Online pay isn't hooked up yet, so the customer sees "call to pay" with the shop's number.</p>`}
    </div>${pastHtml}`;
    $$(".line input", box).forEach((inp) => inp.onchange = () => {
      const l = lines[+inp.closest(".line").dataset.i], k = inp.dataset.k;
      l[k] = k === "taxable" ? inp.checked : (k === "description" || k === "code") ? inp.value : Number(inp.value) || 0;
      if (k !== "description" && k !== "code") draw();
    });
    $$('.line input[data-k="description"]', box).forEach((inp) => {
      const l = lines[+inp.closest(".line").dataset.i];
      if (l.kind === "deposit") return;
      suggestItems(inp, (it) => { Object.assign(l, { code: it.code || "", description: it.description, price: Number(it.price ?? l.price) || 0, taxable: it.taxable, kind: l.kind === "part" || l.kind === "other" || l.kind === "labor" ? (it.kind === "labor" ? "labor" : it.kind === "other" ? "other" : "part") : l.kind }); draw(); });
    });
    $("#invWork").oninput = (e) => workDone = e.target.value; suggestPhrases($("#invWork"), () => workDone = $("#invWork").value);
    $("#invRecs").oninput = (e) => recs = e.target.value;
    $("#invNote").oninput = (e) => note = e.target.value;
    $$("[data-del]", box).forEach((b) => b.onclick = () => { lines.splice(+b.dataset.del, 1); draw(); });
    $$("[data-add]", box).forEach((b) => b.onclick = () => {
      const k = b.dataset.add;
      lines.push(k === "labor" ? laborLine() : k === "deposit" ? { kind: "deposit", description: "Deposit for work to be performed", qty: 1, price: 0, taxable: false } : { kind: k, code: k === "other" ? "SHIPPING/HANDLING" : "", description: k === "other" ? "Shipping/handling" : "", qty: 1, price: 0, taxable: k === "part" });
      draw(); const ins = $$('.line input[data-k="description"]', box); if (k !== "other") ins[ins.length - 1].focus();
    });
    $("#saveD").onclick = () => saveDraft().then(() => toast("Draft saved")).catch(fail);
    $("#send").onclick = sendIt;
    wirePast(box);
  };
  const saveDraft = () => api.update("shop_invoices", `id=eq.${draft.id}`, { lines, work_done: workDone.trim() || null, recommendations: recs.trim() || null, notes: note.trim() || null, ...invTotals(lines, rate), updated_at: new Date().toISOString() });

  async function sendIt() {
    if (!lines.length) return toast("Add something to the invoice first");
    busy("Finishing invoice…");
    try {
      await saveDraft();
      const number = draft.number || await api.rpc("shop_next_invoice_no", { sid: me.shop.id });
      const [inv] = await api.update("shop_invoices", `id=eq.${draft.id}`, { number });
      // remember parts, charges and work lines for next time
      api.rpc("shop_learn_items", { sid: me.shop.id, items: lines.filter((l) => l.kind !== "deposit" && l.description).map((l) => ({ code: l.code || "", description: l.description, price: l.price, taxable: isTaxable(l), kind: l.kind })) }).catch(() => {});
      if (workDone.trim()) api.rpc("shop_learn_phrases", { sid: me.shop.id, texts: workDone.split("\n") }).catch(() => {});
      picks = null;
      if (cust.email) {
        busy("Emailing invoice…");
        const pdf = await invoicePDF(inv, car, cust);
        await api.fn("shop-send", { shop_id: me.shop.id, car_id: car.id, kind: "invoice", invoice_id: inv.id, pdf_base64: pdf, page_url: carLink(car) + "#invoice" });
        await api.insert("shop_entries", { shop_id: me.shop.id, car_id: car.id, kind: "status", body: `Invoice #${number} sent`, shared: false, author_id: me.user.id, author_name: me.member.display_name });
        busy(null); toast("Invoice emailed");
      } else {
        await api.update("shop_invoices", `id=eq.${inv.id}`, { status: "sent", sent_at: new Date().toISOString() });
        busy(null);
        const msg = `${me.shop.name}: your invoice #${number} for the ${carName(car)} is ready — ${money(inv.total)}. View it here: ${carLink(car)}#invoice`;
        sheet(`<h2>Invoice #${number} ready</h2><p class="muted">No email on file, so text the link instead.</p>
          ${cust.phone ? `<a class="btn red block big" href="sms:${esc(cust.phone)}?&body=${encodeURIComponent(msg)}">Text it to ${esc(cust.name.split(" ")[0])}</a>` : ""}
          <button class="btn ghost block" style="margin-top:10px" onclick="this.closest('.sheet-bg').remove()">Done</button>`);
      }
      touchCar(car); refresh("invoice");
    } catch (e) { fail(e); }
  }
  draw();
}

function wirePast(box) {
  const { car, cust, invoices } = carCache;
  $$("[data-paid]", box).forEach((b) => b.onclick = async () => {
    try { await api.update("shop_invoices", `id=eq.${b.dataset.paid}`, { status: "paid", paid_at: new Date().toISOString() }); toast("Marked paid"); refresh("invoice"); } catch (e) { fail(e); }
  });
  $$("[data-resend]", box).forEach((b) => b.onclick = async () => {
    const inv = invoices.find((i) => i.id === b.dataset.resend);
    if (!cust.email) return toast("No email on file for this customer");
    busy("Emailing invoice…");
    try { const pdf = await invoicePDF(inv, car, cust); await api.fn("shop-send", { shop_id: me.shop.id, car_id: car.id, kind: "invoice", invoice_id: inv.id, pdf_base64: pdf, page_url: carLink(car) + "#invoice" }); busy(null); toast("Invoice emailed"); refresh("invoice"); }
    catch (e) { fail(e); }
  });
}

/* Invoice PDF (attached to the email) — same columns as RAW's: Qty, Item Code, Description, Price Each, Amount (T = taxable) */
async function invoicePDF(inv, car, cust) {
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const doc = await PDFDocument.create();
  const f = await doc.embedFont(StandardFonts.Helvetica), fb = await doc.embedFont(StandardFonts.HelveticaBold);
  const shop = me.shop; const red = rgb(0.83, 0.16, 0.18), grey = rgb(0.4, 0.4, 0.4), line = rgb(0.85, 0.85, 0.85);
  const clean = (s) => String(s ?? "").replace(/[\r\n\t]+/g, " ").replace(/[^\x20-\x7E -ÿ–—‘’“”•…]/g, "");
  const W = (s, o = {}) => (o.bold ? fb : f).widthOfTextAtSize(clean(s), o.size || 9);
  const wrap = (s, w, o = {}) => { const out = []; let cur = ""; for (const word of clean(s).split(" ")) { const t = cur ? cur + " " + word : word; if (W(t, o) > w && cur) { out.push(cur); cur = word; } else cur = t; } if (cur) out.push(cur); return out.length ? out : [""]; };
  let page, y, n = 0;
  const text = (s, x, yy, o = {}) => page.drawText(clean(s), { x, y: yy, size: o.size || 9, font: o.bold ? fb : f, color: o.color || rgb(0, 0, 0) });
  const right = (s, x, yy, o = {}) => text(s, x - W(s, o), yy, o);
  const COLS = () => { page.drawRectangle({ x: 40, y: y - 4, width: 532, height: 16, color: rgb(0.93, 0.93, 0.93) }); text("QTY", 46, y, { size: 7.5, bold: true }); text("ITEM CODE", 80, y, { size: 7.5, bold: true }); text("DESCRIPTION", 172, y, { size: 7.5, bold: true }); right("PRICE EACH", 490, y, { size: 7.5, bold: true }); right("AMOUNT", 566, y, { size: 7.5, bold: true }); y -= 18; };
  const newPage = (cols) => {
    page = doc.addPage([612, 792]); n++;
    page.drawRectangle({ x: 0, y: 762, width: 612, height: 30, color: rgb(0.08, 0.08, 0.08) });
    text(shop.name.toUpperCase(), 40, 772, { size: 14, bold: true, color: rgb(1, 1, 1) });
    right("INVOICE", 572, 772, { size: 12, bold: true, color: rgb(1, 1, 1) });
    page.drawRectangle({ x: 0, y: 758, width: 612, height: 4, color: red });
    text(`${shop.phone || ""}   ${shop.email || ""}`, 40, 28, { size: 8, color: grey }); right(`Invoice #${inv.number} · Page ${n}`, 572, 28, { size: 8, color: grey });
    y = 736; if (cols) COLS();
  };
  const need = (h, cols) => { if (y - h < 60) newPage(cols); };

  newPage(false);
  text(shop.address || "", 40, y, { color: grey });
  const dt = new Date(inv.sent_at || Date.now()).toLocaleDateString("en-US");
  [["Date", dt], ["Invoice #", String(inv.number)], ["Terms", "COD"], ["Rep", inv.rep || ""]].forEach(([k, v], i) => { text(k.toUpperCase(), 380 + i * 50, y, { size: 7, bold: true, color: grey }); text(v, 380 + i * 50, y - 12, { bold: true }); });
  y -= 44;
  text("BILL TO", 40, y, { size: 7, bold: true, color: grey }); text("VEHICLE", 320, y, { size: 7, bold: true, color: grey });
  text(cust.name, 40, y - 13, { bold: true, size: 10 }); text(carName(car), 320, y - 13, { bold: true, size: 10 });
  text(cust.phone || "", 40, y - 25); text([car.color, car.vin ? "VIN " + car.vin : ""].filter(Boolean).join(" · "), 320, y - 25);
  text(cust.email || "", 40, y - 37); text(wrap(cust.address || "", 250)[0], 40, y - 49);
  y -= 70; COLS();

  for (const l of inv.lines || []) {
    const desc = wrap(l.description || "", 250);
    need(desc.length * 11 + 8, true);
    const amt = lineAmt(l);
    if (l.kind !== "deposit") right(String(l.qty), 64, y);
    text(wrap(l.kind === "deposit" ? "DEPOSIT" : (l.code || ""), 86)[0], 80, y);
    desc.forEach((d, i) => text(d, 172, y - i * 11));
    right(l.kind === "deposit" ? "-" + money(Math.abs(amt)) : money(l.price), 490, y);
    right((amt < 0 ? "-" : "") + money(Math.abs(amt)) + (isTaxable(l) ? "T" : " "), 572, y);
    y -= desc.length * 11 + 4;
    page.drawLine({ start: { x: 40, y: y + 2 }, end: { x: 572, y: y + 2 }, thickness: 0.5, color: line }); y -= 8;
  }
  need(70, false);
  y -= 4; const dep = depositOf(inv.lines);
  right("Subtotal", 490, y); right(money(inv.subtotal), 566, y); y -= 13;
  right(`Sales tax ${(Number(inv.tax_rate) * 100).toFixed(2)}%`, 490, y); right(money(inv.tax), 566, y); y -= 13;
  if (dep) { right("Deposit paid", 490, y); right("-" + money(dep), 566, y); y -= 13; }
  y -= 4; right("TOTAL", 490, y, { bold: true, size: 12 }); right(money(inv.total), 566, y, { bold: true, size: 12 }); y -= 26;

  const section = (title, body, bullets) => {
    if (!body || !String(body).trim()) return;
    need(40, false); text(title.toUpperCase(), 40, y, { size: 8, bold: true, color: red }); y -= 14;
    for (const raw of String(body).split("\n").map((t) => t.replace(/^[-•*\s]+/, "").trim()).filter(Boolean)) {
      const ls = wrap(raw, bullets ? 510 : 532, { size: 9 });
      need(ls.length * 12 + 2, false);
      ls.forEach((t, i) => { if (bullets && i === 0) text("•", 44, y); text(t, bullets ? 56 : 40, y); y -= 12; });
      y -= 2;
    }
    y -= 10;
  };
  section("Work performed", inv.work_done, true);
  section("Recommendations", inv.recommendations, true);
  section("Note", inv.notes, false);
  need(30, false);
  text(shop.payment_url ? "Pay online from the link in your email." : `To pay, call ${shop.phone || "the shop"}.`, 40, y, { color: grey }); y -= 12;
  text("Thank you for your business.", 40, y, { color: grey });
  return await doc.saveAsBase64();
}

      <label class="f"><span>Labor rate per hour ($)</span><input class="t" id="s_labor" type="number" step="0.01" value="${esc(s.labor_rate)}"></label></div>
      <label class="f"><span>Online payment link (from your card processor, optional)</span><input class="t" id="s_pay" value="${esc(s.payment_url || "")}" placeholder="https://…"></label>
      <label class="f"><span>Drop-off agreement wording</span><textarea class="t" id="s_waiver" style="min-height:140px">${esc(s.waiver_text || "")}</textarea></label>
      <button class="btn red block" type="submit">Save</button></form>`;
  $("#sf").onsubmit = async (e) => {
    e.preventDefault(); busy("Saving…");
    try {
      const patch = { name: $("#s_name").value.trim() || s.name, phone: $("#s_phone").value.trim() || null, email: $("#s_email").value.trim() || null, address: $("#s_addr").value.trim() || null,
        tax_rate: r2(Number($("#s_tax").value) * 1000) / 100000, labor_rate: r2($("#s_labor").value), payment_url: $("#s_pay").value.trim() || null, waiver_text: $("#s_waiver").value.trim() || null };
      const [row] = await api.update("shops", `id=eq.${s.id}`, patch);
      me.shop = row || { ...s, ...patch }; busy(null); toast("Saved");
    } catch (err) { fail(err); }
  };
}

render();
})();
</script>
</body>
</html>
