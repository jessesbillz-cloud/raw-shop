<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="robots" content="noindex">
<title>Your Vehicle · RAW Motorsports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<style>
  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:14px}
  .steps div{height:8px;border-radius:4px;background:var(--panel2)}
  .steps div.on{background:var(--red)}
  .steplbl{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.04em}
  .steplbl .on{color:var(--text);font-weight:700}
  .big-ph{aspect-ratio:16/10;border-radius:12px;background:#222 center/cover;margin-top:14px}
  .feed .entry{grid-template-columns:1fr}
  .due{border:2px solid var(--red)}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:30px 16px 40px}
</style>
</head>
<body>
<header class="top"><div class="brand"><b>RAW</b> <span id="shopName">Motorsports</span></div></header>
<main class="wrap" id="view"><div class="empty">Loading your vehicle…</div></main>
<footer id="foot"></footer>
<script src="js/api.js"></script>
<script>
(async () => {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = (n) => "$" + (Number(n) || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const when = (t) => { const d = new Date(t); return d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }) + " · " + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); };
  const view = $("#view");
  const token = new URLSearchParams(location.search).get("t");
  const STEPS = [["checked_in", "Checked in"], ["in_progress", "Working"], ["waiting_parts", "Parts"], ["ready", "Ready"]];
  const LABEL = { checked_in: "Checked in", in_progress: "We're working on it", waiting_parts: "Waiting on parts", ready: "Ready for pickup", picked_up: "Picked up" };

  let d;
  try { d = await api.fn("shop-public", { token }, true); }
  catch (e) { view.innerHTML = `<div class="card"><h2>Link not found</h2><p class="muted">Check the link the shop sent you, or give them a call.</p></div>`; return; }

  const { shop, car, entries, invoices } = d;
  document.title = `Your ${[car.year, car.make, car.model].filter(Boolean).join(" ") || "Vehicle"} · ${shop.name}`;
  $("#shopName").textContent = shop.name.replace(/^RAW\s*/i, "") || shop.name;
  const name = [car.year, car.make, car.model].filter(Boolean).join(" ") || "your vehicle";
  const idx = car.status === "picked_up" ? 4 : Math.max(0, STEPS.findIndex((s) => s[0] === car.status));
  const due = invoices.find((i) => i.status === "sent");

  // group photos posted together
  const groups = [];
  for (const e of entries) {
    const g = groups[groups.length - 1];
    if (g && e.kind === "photo" && g.kind === "photo" && Math.abs(new Date(g.items[g.items.length - 1].created_at) - new Date(e.created_at)) < 15 * 60 * 1000) g.items.push(e);
    else groups.push({ kind: e.kind, items: [e] });
  }

  const invHtml = (inv) => `<div class="card section ${inv.status === "sent" ? "due" : ""}" id="${inv.status === "sent" ? "invoice" : ""}">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><h2>Invoice #${inv.number}</h2>
      <span class="pill ${inv.status === "paid" ? "s-ready" : "s-waiting_parts"}">${inv.status === "paid" ? "Paid" : "Due"}</span></div>
      <div style="overflow-x:auto"><table class="inv section"><thead><tr><th>Item</th><th class="r">Qty</th><th class="r">Amount</th></tr></thead><tbody>
      ${(inv.lines || []).map((l) => `<tr><td>${esc(l.kind === "labor" && l.description === "Labor" ? "Labor" : l.description)}</td><td class="r">${esc(l.qty)}</td><td class="r">${money((Number(l.qty) || 0) * (Number(l.price) || 0))}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="totals section"><div><span>Subtotal</span><span>${money(inv.subtotal)}</span></div><div><span>Tax</span><span>${money(inv.tax)}</span></div><div class="grand"><span>Total</span><span>${money(inv.total)}</span></div></div>
      ${inv.notes ? `<p style="white-space:pre-wrap">${esc(inv.notes)}</p>` : ""}
      ${inv.status === "sent" ? (shop.payment_url
        ? `<a class="btn red block big section" href="${esc(shop.payment_url)}${shop.payment_url.includes("?") ? "&" : "?"}invoice=${inv.number}&amount=${inv.total}" target="_blank" rel="noopener">Pay ${money(inv.total)}</a>`
        : `<div class="section"><p class="muted" style="margin:0 0 8px">To pay, give the shop a call:</p><a class="btn red block big" href="tel:${esc(shop.phone || "")}">Call ${esc(shop.phone || "the shop")}</a></div>`) : ""}
    </div>`;

  view.innerHTML = `
    <h1>Hi ${esc(d.customer_first || "there")}</h1>
    <p class="muted" style="margin:4px 0 0">Here's your ${esc(name)}${car.color ? " (" + esc(car.color) + ")" : ""} at ${esc(shop.name)}.</p>
    ${car.intake_photo ? `<div class="big-ph" style="background-image:url('${esc(car.intake_photo)}')"></div>` : ""}
    <div class="card section">
      <div class="small muted">Status</div><h2 style="margin-top:2px">${esc(LABEL[car.status] || car.status)}</h2>
      <div class="steps">${STEPS.map((s, i) => `<div class="${i <= idx ? "on" : ""}"></div>`).join("")}</div>
      <div class="steplbl">${STEPS.map((s, i) => `<span class="${i === idx ? "on" : ""}">${s[1]}</span>`).join("")}</div>
    </div>
    ${due ? invHtml(due) : ""}
    ${car.work_requested ? `<div class="card section"><div class="small muted">What we're doing</div><div style="white-space:pre-wrap;margin-top:4px">${esc(car.work_requested)}</div></div>` : ""}
    <div class="section"><h2>Updates from the shop</h2>
      <div class="feed">${groups.length ? groups.map((g) => {
        const e = g.items[0];
        const meta = `<div class="meta">${when(e.created_at)}${e.author_name ? " · " + esc(e.author_name) : ""}</div>`;
        if (g.kind === "photo") return `<div class="entry">${meta}${g.items.map((x) => x.body).filter(Boolean).map((b) => `<div class="body">${esc(b)}</div>`).join("")}<div class="pics">${g.items.filter((x) => x.photo).map((x) => `<img loading="lazy" src="${esc(x.photo)}" alt="Shop photo" data-full="${esc(x.photo)}">`).join("")}</div></div>`;
        if (g.kind === "status") return `<div class="entry">${meta}<div class="body"><strong>${esc(e.body)}</strong></div></div>`;
        return `<div class="entry">${meta}<div class="body">${esc(e.body)}</div></div>`;
      }).join("") : `<div class="empty">Photos and notes from the shop will show up here.</div>`}</div>
    </div>
    ${invoices.filter((i) => i !== due).map(invHtml).join("")}
    <div class="card section"><h2>Questions?</h2><p class="muted" style="margin:6px 0 12px">${esc(shop.address || "")}</p>
      <div class="row">${shop.phone ? `<a class="btn red" href="tel:${esc(shop.phone)}">Call the shop</a>` : ""}${shop.phone ? `<a class="btn ghost" href="sms:${esc(shop.phone)}">Text</a>` : ""}</div>
      <p class="small muted" style="margin:12px 0 0">${esc(shop.phone || "")}${shop.email ? " · " + esc(shop.email) : ""}</p>
    </div>`;
  $("#foot").textContent = `${shop.name} · ${shop.address || ""}`;
  view.querySelectorAll(".pics img").forEach((i) => i.onclick = () => {
    const lb = document.createElement("div"); lb.className = "lightbox"; lb.innerHTML = `<img src="${esc(i.dataset.full)}" alt="">`;
    lb.onclick = () => lb.remove(); document.body.appendChild(lb);
  });
  if (location.hash === "#invoice" && $("#invoice")) $("#invoice").scrollIntoView({ behavior: "smooth" });
})();
</script>
</body>
</html>
